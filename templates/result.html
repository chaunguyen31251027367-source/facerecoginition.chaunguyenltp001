<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả nhận diện</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #fff0f5;
            --pink-soft: #fce4ec;
            --pink-main: #f48fb1;
            --pink-deep: #e91e8c;
            --pink-accent: #ff80ab;
            --pink-muted: #f8bbd0;
            --white: #ffffff;
            --text-dark: #3d1a2e;
            --text-mid: #7b4c68;
            --text-light: #c084a8;
            --shadow: rgba(244, 143, 177, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--pink-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 24px 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: -120px; right: -80px;
            width: 420px; height: 420px;
            background: radial-gradient(circle, #fce4ec 0%, #f8bbd0 50%, transparent 75%);
            border-radius: 50%;
            z-index: 0;
            animation: floatBlob 8s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -100px; left: -60px;
            width: 360px; height: 360px;
            background: radial-gradient(circle, #fce4ec 0%, #ffd6e8 60%, transparent 75%);
            border-radius: 50%;
            z-index: 0;
            animation: floatBlob 10s ease-in-out infinite reverse;
        }
        @keyframes floatBlob {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(20px,-20px) scale(1.05); }
        }

        .dot {
            position: fixed;
            border-radius: 50%;
            background: var(--pink-muted);
            opacity: 0.5;
            z-index: 0;
            animation: floatDot linear infinite;
        }
        @keyframes floatDot {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255,182,213,0.45);
            border-radius: 32px;
            width: 440px;
            max-width: 95vw;
            padding: 44px 40px 40px;
            box-shadow: 0 8px 40px var(--shadow), 0 2px 8px rgba(233,30,140,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
            animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
            text-align: center;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(36px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Photo display ── */
        .photo-section {
            margin-bottom: 28px;
            animation: slideUp 0.7s 0.08s cubic-bezier(0.22,1,0.36,1) both;
        }
        .photo-frame {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 2.5px solid var(--pink-muted);
            background: var(--pink-soft);
            aspect-ratio: 4/3;
            box-shadow: 0 4px 20px rgba(244,143,177,0.25);
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Scan overlay on the photo */
        .photo-scan {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .photo-corner {
            position: absolute;
            width: 24px; height: 24px;
            border-color: rgba(233,30,140,0.7);
            border-style: solid;
        }
        .photo-corner.tl { top: 10px; left: 10px; border-width: 2.5px 0 0 2.5px; border-radius: 3px 0 0 0; }
        .photo-corner.tr { top: 10px; right: 10px; border-width: 2.5px 2.5px 0 0; border-radius: 0 3px 0 0; }
        .photo-corner.bl { bottom: 10px; left: 10px; border-width: 0 0 2.5px 2.5px; border-radius: 0 0 0 3px; }
        .photo-corner.br { bottom: 10px; right: 10px; border-width: 0 2.5px 2.5px 0; border-radius: 0 0 3px 0; }

        .result-chip {
            position: absolute;
            bottom: 12px; left: 50%; transform: translateX(-50%);
            white-space: nowrap;
            background: rgba(233,30,140,0.88);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
        }

        /* ── Check wrap ── */
        .check-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            animation: slideUp 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) both;
        }
        .check-ring {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 0 0 8px rgba(244,143,177,0.15), 0 4px 20px rgba(244,143,177,0.3);
        }
        .check-ring::before {
            content: '';
            position: absolute; inset: -6px;
            border-radius: 50%;
            border: 2px dashed var(--pink-muted);
            animation: spin 14s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .check-ring svg {
            width: 34px; height: 34px;
            animation: checkPop 0.5s 0.4s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes checkPop {
            from { transform: scale(0) rotate(-20deg); opacity: 0; }
            to   { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .result-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--pink-main);
            margin-bottom: 8px;
            animation: slideUp 0.7s 0.15s cubic-bezier(0.22,1,0.36,1) both;
        }
        .result-name {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.2;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--text-dark), var(--pink-deep));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideUp 0.7s 0.2s cubic-bezier(0.22,1,0.36,1) both;
        }
        .result-sub {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 28px;
            animation: slideUp 0.7s 0.25s cubic-bezier(0.22,1,0.36,1) both;
        }

        .badge-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            animation: slideUp 0.7s 0.28s cubic-bezier(0.22,1,0.36,1) both;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(252,228,236,0.8), rgba(255,240,245,0.9));
            border: 1.5px solid var(--pink-muted);
            border-radius: 50px;
            padding: 8px 18px;
            font-size: 13px;
            color: var(--text-mid);
            font-weight: 500;
        }
        .badge-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink-deep), var(--pink-accent));
            box-shadow: 0 0 6px rgba(233,30,140,0.4);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        .confidence-bar-wrap {
            margin-bottom: 28px;
            animation: slideUp 0.7s 0.3s cubic-bezier(0.22,1,0.36,1) both;
        }
        .confidence-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        .confidence-bar-bg {
            height: 8px;
            background: var(--pink-soft);
            border-radius: 99px;
            overflow: hidden;
        }
        .confidence-bar-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--pink-deep), var(--pink-accent));
            width: 0%;
            transition: width 1.2s cubic-bezier(0.22,1,0.36,1);
            box-shadow: 0 2px 8px rgba(233,30,140,0.3);
        }

        .btn-back {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--pink-deep) 0%, #ff6bac 60%, var(--pink-accent) 100%);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(233,30,140,0.35);
            transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.7s 0.35s cubic-bezier(0.22,1,0.36,1) both;
        }
        .btn-back::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s ease;
        }
        .btn-back:hover::before { left: 100%; }
        .btn-back:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(233,30,140,0.4); }

        .bottom-tag {
            text-align: center;
            margin-top: 20px;
            font-size: 11.5px;
            color: var(--text-light);
            animation: slideUp 0.7s 0.4s cubic-bezier(0.22,1,0.36,1) both;
        }
        .bottom-tag span { color: var(--pink-main); font-weight: 500; }

        .corner-deco { position: absolute; width: 60px; height: 60px; pointer-events: none; }
        .corner-deco.tl { top: 18px; left: 18px; }
        .corner-deco.br { bottom: 18px; right: 18px; transform: rotate(180deg); }
    </style>
</head>
<body>

    <script>
        for (let i = 0; i < 10; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            const size = Math.random() * 10 + 5;
            dot.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}vw;animation-duration:${Math.random()*12+8}s;animation-delay:${Math.random()*8}s;`;
            document.body.appendChild(dot);
        }
    </script>

    <div class="card">
        <svg class="corner-deco tl" viewBox="0 0 60 60" fill="none">
            <circle cx="8" cy="8" r="4" fill="#f8bbd0" opacity="0.6"/>
            <circle cx="20" cy="8" r="2.5" fill="#f48fb1" opacity="0.4"/>
            <circle cx="8" cy="20" r="2.5" fill="#f48fb1" opacity="0.4"/>
            <path d="M2 2 L18 2 L18 4 L4 4 L4 18 L2 18 Z" fill="#fce4ec" opacity="0.8"/>
        </svg>
        <svg class="corner-deco br" viewBox="0 0 60 60" fill="none">
            <circle cx="8" cy="8" r="4" fill="#f8bbd0" opacity="0.6"/>
            <circle cx="20" cy="8" r="2.5" fill="#f48fb1" opacity="0.4"/>
            <circle cx="8" cy="20" r="2.5" fill="#f48fb1" opacity="0.4"/>
            <path d="M2 2 L18 2 L18 4 L4 4 L4 18 L2 18 Z" fill="#fce4ec" opacity="0.8"/>
        </svg>

        <!-- Photo display with result overlay -->
        <div class="photo-section">
            <div class="photo-frame">
                <img src="data:image/jpeg;base64,{{ image_b64 }}" alt="Ảnh nhận diện">
                <div class="photo-scan">
                    <div class="photo-corner tl"></div>
                    <div class="photo-corner tr"></div>
                    <div class="photo-corner bl"></div>
                    <div class="photo-corner br"></div>
                </div>
                <div class="result-chip">{{ result }}</div>
            </div>
        </div>

        <!-- Check icon -->
        <div class="check-wrap">
            <div class="check-ring">
                <svg viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="16" stroke="#f48fb1" stroke-width="2" fill="rgba(252,228,236,0.5)"/>
                    <path d="M12 20.5 L17.5 26 L28 14" stroke="#e91e8c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <div class="result-label">✦ Nhận diện thành công ✦</div>
        <div class="result-name">{{ result }}</div>
        <div class="result-sub">Đã xác định được thành viên trong lớp</div>

        <div class="badge-wrap">
            <div class="badge">
                <div class="badge-dot"></div>
                Độ chính xác: {{ confidence }}%
            </div>
        </div>

        <div class="confidence-bar-wrap">
            <div class="confidence-bar-label">
                <span>Mức tin cậy</span>
                <span>{{ confidence }}%</span>
            </div>
            <div class="confidence-bar-bg">
                <div class="confidence-bar-fill" id="confBar"></div>
            </div>
        </div>

        <a href="/" class="btn-back">← Nhận diện ảnh khác</a>

        <div class="bottom-tag">
            Powered by <span>Face Recognition AI</span> ✦ Bảo mật & nhanh chóng
        </div>
    </div>

    <script>
        setTimeout(() => {
            const bar = document.getElementById('confBar');
            if (bar) bar.style.width = '{{ confidence }}%';
        }, 300);
    </script>
</body>
</html>
