<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition — Nhận diện khuôn mặt</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #fff0f5;
            --pink-soft: #fce4ec;
            --pink-main: #f48fb1;
            --pink-deep: #e91e8c;
            --pink-accent: #ff80ab;
            --pink-muted: #f8bbd0;
            --white: #ffffff;
            --text-dark: #3d1a2e;
            --text-mid: #7b4c68;
            --text-light: #c084a8;
            --shadow: rgba(244, 143, 177, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--pink-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -120px; right: -80px;
            width: 420px; height: 420px;
            background: radial-gradient(circle, #fce4ec 0%, #f8bbd0 50%, transparent 75%);
            border-radius: 50%;
            z-index: 0;
            animation: floatBlob 8s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -100px; left: -60px;
            width: 360px; height: 360px;
            background: radial-gradient(circle, #fce4ec 0%, #ffd6e8 60%, transparent 75%);
            border-radius: 50%;
            z-index: 0;
            animation: floatBlob 10s ease-in-out infinite reverse;
        }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(20px,-20px) scale(1.05); }
        }

        .dot {
            position: fixed;
            border-radius: 50%;
            background: var(--pink-muted);
            opacity: 0.5;
            z-index: 0;
            animation: floatDot linear infinite;
        }
        @keyframes floatDot {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255,182,213,0.45);
            border-radius: 32px;
            width: 440px;
            max-width: 95vw;
            padding: 44px 40px 40px;
            box-shadow: 0 8px 40px var(--shadow), 0 2px 8px rgba(233,30,140,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
            animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(36px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .face-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            animation: slideUp 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) both;
        }

        .face-icon-ring {
            width: 88px; height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 0 0 8px rgba(244,143,177,0.15), 0 4px 20px rgba(244,143,177,0.3);
        }
        .face-icon-ring::before {
            content: '';
            position: absolute; inset: -6px;
            border-radius: 50%;
            border: 2px dashed var(--pink-muted);
            animation: spin 14s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .face-icon-ring svg { width: 42px; height: 42px; }
        .scan-dot {
            position: absolute;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--pink-deep);
            top: -4px; left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 6px var(--pink-accent);
        }

        .headline {
            text-align: center;
            margin-bottom: 6px;
            animation: slideUp 0.7s 0.15s cubic-bezier(0.22,1,0.36,1) both;
        }
        .headline h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.25;
        }
        .headline h1 span {
            background: linear-gradient(135deg, var(--pink-deep), var(--pink-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            text-align: center;
            font-size: 13.5px;
            color: var(--text-light);
            margin-bottom: 28px;
            animation: slideUp 0.7s 0.2s cubic-bezier(0.22,1,0.36,1) both;
        }

        /* Tab switcher */
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(252,228,236,0.4);
            border-radius: 14px;
            padding: 5px;
            animation: slideUp 0.7s 0.22s cubic-bezier(0.22,1,0.36,1) both;
        }
        .tab-btn {
            flex: 1;
            padding: 9px 0;
            border: none;
            border-radius: 10px;
            background: transparent;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background: white;
            color: var(--pink-deep);
            box-shadow: 0 2px 8px rgba(233,30,140,0.15);
            font-weight: 600;
        }

        /* Upload area */
        .upload-area {
            margin-bottom: 20px;
            animation: slideUp 0.7s 0.25s cubic-bezier(0.22,1,0.36,1) both;
        }
        .upload-zone {
            border: 2px dashed var(--pink-muted);
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            background: linear-gradient(135deg, rgba(252,228,236,0.4), rgba(255,240,245,0.6));
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .upload-zone input[type="file"] {
            position: absolute; inset: 0;
            opacity: 0; width: 100%; height: 100%;
            cursor: pointer;
        }
        .upload-zone:hover, .upload-zone.drag-over {
            border-color: var(--pink-main);
            background: linear-gradient(135deg, rgba(252,228,236,0.7), rgba(255,240,245,0.9));
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(244,143,177,0.2);
        }
        .upload-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--pink-deep), var(--pink-accent));
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 10px;
            box-shadow: 0 4px 12px rgba(233,30,140,0.3);
        }
        .upload-icon svg { width: 22px; height: 22px; stroke: white; }
        .upload-text-main { font-size: 14px; font-weight: 500; color: var(--text-dark); margin-bottom: 4px; }
        .upload-text-sub { font-size: 12px; color: var(--text-light); }

        /* Image preview */
        .preview-wrap {
            display: none;
            margin-bottom: 20px;
            animation: slideUp 0.4s cubic-bezier(0.22,1,0.36,1) both;
        }
        .preview-wrap.show { display: block; }
        .preview-img-container {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid var(--pink-muted);
            background: var(--pink-soft);
            aspect-ratio: 4/3;
        }
        .preview-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .preview-label {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(233,30,140,0.85);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        .preview-change {
            position: absolute;
            bottom: 10px; right: 10px;
            background: rgba(255,255,255,0.9);
            color: var(--pink-deep);
            font-size: 11.5px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            border: 1.5px solid var(--pink-muted);
            transition: all 0.2s ease;
        }
        .preview-change:hover { background: white; box-shadow: 0 2px 8px rgba(233,30,140,0.2); }

        /* Camera section */
        .camera-section {
            display: none;
            margin-bottom: 20px;
            animation: slideUp 0.7s 0.25s cubic-bezier(0.22,1,0.36,1) both;
        }
        .camera-section.show { display: block; }

        .camera-container {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid var(--pink-muted);
            background: #1a0a12;
            aspect-ratio: 4/3;
        }
        #cameraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1); /* mirror */
        }
        #cameraCanvas { display: none; }

        /* Scan overlay */
        .camera-overlay {
            position: absolute; inset: 0;
            pointer-events: none;
        }
        .scan-corner {
            position: absolute;
            width: 28px; height: 28px;
            border-color: var(--pink-accent);
            border-style: solid;
        }
        .scan-corner.tl { top: 14px; left: 14px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
        .scan-corner.tr { top: 14px; right: 14px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
        .scan-corner.bl { bottom: 14px; left: 14px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
        .scan-corner.br { bottom: 14px; right: 14px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

        .scan-line-anim {
            position: absolute;
            left: 14px; right: 14px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--pink-accent), transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            box-shadow: 0 0 8px var(--pink-accent);
        }
        @keyframes scanMove {
            0%   { top: 14px; opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { top: calc(100% - 14px); opacity: 0; }
        }

        .camera-btns {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-cam {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-snap {
            background: linear-gradient(135deg, var(--pink-deep), var(--pink-accent));
            color: white;
            box-shadow: 0 4px 16px rgba(233,30,140,0.3);
        }
        .btn-snap:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(233,30,140,0.35); }
        .btn-retake {
            background: rgba(252,228,236,0.6);
            color: var(--text-mid);
            border: 1.5px solid var(--pink-muted);
        }
        .btn-retake:hover { background: rgba(252,228,236,0.9); }

        /* Submit button */
        .btn-predict {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--pink-deep) 0%, #ff6bac 60%, var(--pink-accent) 100%);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(233,30,140,0.35);
            transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.7s 0.3s cubic-bezier(0.22,1,0.36,1) both;
        }
        .btn-predict::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s ease;
        }
        .btn-predict:hover::before { left: 100%; }
        .btn-predict:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(233,30,140,0.4); }
        .btn-predict:active { transform: translateY(0); }
        .btn-predict .btn-inner { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-predict:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .bottom-tag {
            text-align: center;
            margin-top: 20px;
            font-size: 11.5px;
            color: var(--text-light);
            animation: slideUp 0.7s 0.35s cubic-bezier(0.22,1,0.36,1) both;
        }
        .bottom-tag span { color: var(--pink-main); font-weight: 500; }

        .corner-deco { position: absolute; width: 60px; height: 60px; pointer-events: none; }
        .corner-deco.tl { top: 18px; left: 18px; }
        .corner-deco.br { bottom: 18px; right: 18px; transform: rotate(180deg); }

        /* Hidden image input for camera */
        #cameraFileInput { display: none; }
    </style>
</head>
<body>

    <script>
        for (let i = 0; i < 10; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            const size = Math.random() * 10 + 5;
            dot.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}vw;animation-duration:${Math.random()*12+8}s;animation-delay:${Math.random()*8}s;`;
            document.body.appendChild(dot);
        }
    </script>

    <div class="card">
        <svg class="corner-deco tl" viewBox="0 0 60 60" fill="none">
            <circle cx="8" cy="8" r="4" fill="#f8bbd0" opacity="0.6"/>
            <circle cx="20" cy="8" r="2.5" fill="#f48fb1" opacity="0.4"/>
            <circle cx="8" cy="20" r="2.5" fill="#f48fb1" opacity="0.4"/>
            <path d="M2 2 L18 2 L18 4 L4 4 L4 18 L2 18 Z" fill="#fce4ec" opacity="0.8"/>
        </svg>
        <svg class="corner-deco br" viewBox="0 0 60 60" fill="none">
            <circle cx="8" cy="8" r="4" fill="#f8bbd0" opacity="0.6"/>
            <circle cx="20" cy="8" r="2.5" fill="#f48fb1" opacity="0.4"/>
            <circle cx="8" cy="20" r="2.5" fill="#f48fb1" opacity="0.4"/>
            <path d="M2 2 L18 2 L18 4 L4 4 L4 18 L2 18 Z" fill="#fce4ec" opacity="0.8"/>
        </svg>

        <div class="face-icon-wrap">
            <div class="face-icon-ring">
                <div class="scan-dot"></div>
                <svg viewBox="0 0 42 42" fill="none">
                    <ellipse cx="21" cy="19" rx="10" ry="12" stroke="#e91e8c" stroke-width="2" fill="none"/>
                    <circle cx="17" cy="16" r="1.5" fill="#e91e8c"/>
                    <circle cx="25" cy="16" r="1.5" fill="#e91e8c"/>
                    <path d="M17 22 Q21 25.5 25 22" stroke="#e91e8c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                    <line x1="11" y1="19" x2="31" y2="19" stroke="#ff80ab" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7"/>
                    <path d="M7 10 L7 7 L10 7" stroke="#f48fb1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                    <path d="M35 10 L35 7 L32 7" stroke="#f48fb1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                    <path d="M7 28 L7 31 L10 31" stroke="#f48fb1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                    <path d="M35 28 L35 31 L32 31" stroke="#f48fb1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                </svg>
            </div>
        </div>

        <div class="headline">
            <h1>Nhận diện <span>khuôn mặt</span></h1>
        </div>
        <p class="subtitle">Tải ảnh lên hoặc chụp trực tiếp để nhận diện</p>

        <!-- Tab switcher -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tabUpload" onclick="switchTab('upload')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                Tải ảnh lên
            </button>
            <button class="tab-btn" id="tabCamera" onclick="switchTab('camera')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                Chụp camera
            </button>
        </div>

        <!-- Upload tab -->
        <form action="/predict" method="post" enctype="multipart/form-data" id="uploadForm">
            <div id="uploadSection" class="upload-area">
                <label class="upload-zone" id="uploadZone">
                    <input type="file" name="file" accept="image/*" id="fileInput">
                    <div class="upload-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <div class="upload-text-main">Chọn ảnh hoặc kéo thả vào đây</div>
                    <div class="upload-text-sub">PNG, JPG, JPEG — tối đa 10MB</div>
                </label>

                <!-- Preview -->
                <div class="preview-wrap" id="previewWrap">
                    <div class="preview-img-container">
                        <img id="previewImg" src="" alt="preview">
                        <div class="preview-label">✦ Ảnh đã chọn</div>
                        <button type="button" class="preview-change" onclick="clearFile()">Đổi ảnh</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-predict" id="btnPredict" disabled>
                <div class="btn-inner">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Nhận diện ngay
                </div>
            </button>
        </form>

        <!-- Camera tab -->
        <div id="cameraSection" class="camera-section">
            <div class="camera-container" id="cameraContainer">
                <video id="cameraVideo" autoplay playsinline></video>
                <canvas id="cameraCanvas"></canvas>

                <!-- Scan overlay -->
                <div class="camera-overlay">
                    <div class="scan-corner tl"></div>
                    <div class="scan-corner tr"></div>
                    <div class="scan-corner bl"></div>
                    <div class="scan-corner br"></div>
                    <div class="scan-line-anim" id="scanLine"></div>
                </div>

                <!-- Preview after snap -->
                <img id="snapPreview" style="display:none;width:100%;height:100%;object-fit:cover;position:absolute;inset:0;">
                <div class="preview-label" id="snapLabel" style="display:none;position:absolute;top:10px;left:10px;">✦ Ảnh đã chụp</div>
            </div>

            <div class="camera-btns">
                <button type="button" class="btn-cam btn-snap" id="btnSnap" onclick="snapPhoto()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="white" stroke="none"/>
                    </svg>
                    Chụp ảnh
                </button>
                <button type="button" class="btn-cam btn-retake" id="btnRetake" style="display:none" onclick="retakePhoto()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.75"/>
                    </svg>
                    Chụp lại
                </button>
            </div>

            <!-- Separate form for camera -->
            <form action="/predict" method="post" enctype="multipart/form-data" id="cameraForm" style="margin-top:12px;">
                <input type="hidden" name="image_data" id="cameraImageData">
                <button type="submit" class="btn-predict" id="btnCamPredict" disabled>
                    <div class="btn-inner">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        Nhận diện ngay
                    </div>
                </button>
            </form>
        </div>

        <div class="bottom-tag">
            Powered by <span>Face Recognition AI</span> ✦ Bảo mật & nhanh chóng
        </div>
    </div>

    <script>
        // ── Floating dots ──
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const previewWrap = document.getElementById('previewWrap');
        const previewImg = document.getElementById('previewImg');
        const btnPredict = document.getElementById('btnPredict');

        // ── Tab switching ──
        let cameraStream = null;

        function switchTab(tab) {
            const tabUpload = document.getElementById('tabUpload');
            const tabCamera = document.getElementById('tabCamera');
            const uploadSection = document.getElementById('uploadSection');
            const cameraSection = document.getElementById('cameraSection');
            const uploadForm = document.getElementById('uploadForm');

            if (tab === 'upload') {
                tabUpload.classList.add('active');
                tabCamera.classList.remove('active');
                uploadSection.style.display = '';
                uploadForm.querySelector('.btn-predict').style.display = '';
                cameraSection.classList.remove('show');
                stopCamera();
            } else {
                tabCamera.classList.add('active');
                tabUpload.classList.remove('active');
                uploadSection.style.display = 'none';
                uploadForm.querySelector('.btn-predict').style.display = 'none';
                cameraSection.classList.add('show');
                startCamera();
            }
        }

        // ── Upload / Preview ──
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    uploadZone.style.display = 'none';
                    previewWrap.classList.add('show');
                    btnPredict.disabled = false;
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        function clearFile() {
            fileInput.value = '';
            previewImg.src = '';
            uploadZone.style.display = '';
            previewWrap.classList.remove('show');
            btnPredict.disabled = true;
        }

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
        uploadZone.addEventListener('drop', (e) => {
            uploadZone.classList.remove('drag-over');
        });

        // ── Camera ──
        async function startCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                document.getElementById('cameraVideo').srcObject = cameraStream;
                document.getElementById('scanLine').style.display = '';
            } catch (err) {
                alert('Không thể truy cập camera. Vui lòng cho phép quyền camera.');
            }
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
        }

        function snapPhoto() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('cameraCanvas');
            const snapPreview = document.getElementById('snapPreview');
            const snapLabel = document.getElementById('snapLabel');
            const btnSnap = document.getElementById('btnSnap');
            const btnRetake = document.getElementById('btnRetake');
            const btnCamPredict = document.getElementById('btnCamPredict');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            // Mirror flip to match display
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);

            const dataURL = canvas.toDataURL('image/jpeg', 0.92);
            document.getElementById('cameraImageData').value = dataURL;

            snapPreview.src = dataURL;
            snapPreview.style.display = 'block';
            video.style.display = 'none';
            document.getElementById('scanLine').style.display = 'none';
            snapLabel.style.display = 'block';

            btnSnap.style.display = 'none';
            btnRetake.style.display = 'flex';
            btnCamPredict.disabled = false;
        }

        function retakePhoto() {
            const video = document.getElementById('cameraVideo');
            const snapPreview = document.getElementById('snapPreview');
            const snapLabel = document.getElementById('snapLabel');
            const btnSnap = document.getElementById('btnSnap');
            const btnRetake = document.getElementById('btnRetake');
            const btnCamPredict = document.getElementById('btnCamPredict');

            snapPreview.style.display = 'none';
            snapLabel.style.display = 'none';
            video.style.display = '';
            document.getElementById('scanLine').style.display = '';
            document.getElementById('cameraImageData').value = '';

            btnSnap.style.display = 'flex';
            btnRetake.style.display = 'none';
            btnCamPredict.disabled = true;
        }
    </script>
</body>
</html>
